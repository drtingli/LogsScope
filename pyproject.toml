[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logscope"
version = "0.1.0"
description = "A lightweight local tool for analyzing log files, with flexible highlighting and filtering plus live monitoring."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ting Li" },
]
keywords = ["log", "log-viewer", "tail", "filtering", "highlighting", "pyside6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Log Analysis",
]
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/drtingli/logscope"
Repository = "https://github.com/drtingli/logscope"
Issues = "https://github.com/drtingli/logscope/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
logscope = "logscope.app:main"

[project.gui-scripts]
logscope-gui = "logscope.app:gui_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
